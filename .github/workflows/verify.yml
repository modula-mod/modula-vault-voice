name: verify
on: [push, pull_request]
jobs:
  vault-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: modula-vault-voice}
      - uses: actions/checkout@v4
        with:
          repository: modula-mod/modula-module-standard
          ref: mms-v2.1.0
          path: modula-module-standard
      - uses: actions/checkout@v4
        with:
          repository: modula-mod/modula-product-standard
          ref: d3086e1f598395d2e24456172953909f3da1bf3e
          path: modula-product-standard
          ssh-key: ${{ secrets.MPS_READONLY_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v4
        with: {version: 11.11.0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: modula-vault-voice/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: modula-module-standard
      - run: pnpm build
        working-directory: modula-module-standard
      - run: pnpm install --frozen-lockfile
        working-directory: modula-product-standard
      - run: pnpm build
        working-directory: modula-product-standard
      - run: pnpm install --frozen-lockfile
        working-directory: modula-vault-voice
      - run: pnpm verify
        working-directory: modula-vault-voice
      - run: git diff --exit-code -- frontend/frontend.manifest.json modula.product.json
        working-directory: modula-vault-voice
      - run: pnpm mps verify ../modula-vault-voice
        working-directory: modula-product-standard
